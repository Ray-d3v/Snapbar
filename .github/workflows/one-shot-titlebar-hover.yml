name: Apply title-bar hover redesign

on:
  push:
    branches: [feat/titlebar-hover-controls]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/titlebar-hover-controls
          fetch-depth: 0

      - name: Apply title-bar source payload
        shell: pwsh
        run: python tools/apply_titlebar_payload.py

      - name: Format and commit redesign
        shell: pwsh
        run: |
          cargo fmt --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --force tools/titlebar-payload tools/apply_titlebar_payload.py .github/workflows/one-shot-titlebar-hover.yml
          git add src/app.rs src/overlay.rs README.md AGENTS.md docs/OVERLAY_BEHAVIOR.md
          git commit -m "feat: move controls into Teams title bar"
          git push origin HEAD:feat/titlebar-hover-controls
