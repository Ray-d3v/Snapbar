name: Apply native hover and titlebar placement fix

on:
  push:
    branches: [fix/native-hover-titlebar-placement]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-hover-titlebar-placement
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Patch GPUI view and docs
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)


          def sub_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return updated


          app_path = Path("src/app.rs")
          app = app_path.read_text(encoding="utf-8")

          app = app.replace("Context, Task, Window", "Context, Window")
          app = re.sub(
              r"const EXPAND_DELAY: Duration = Duration::from_millis\(180\);\n"
              r"const COLLAPSE_DELAY: Duration = Duration::from_millis\(400\);\n",
              "",
              app,
              count=1,
          )
          app = app.replace("    surface_hovered: bool,\n", "", 1)
          app = app.replace("    hover_transition: Option<Task<()>>,\n", "", 1)

          app = replace_once(
              app,
              "    fn new(window: &mut Window, cx: &mut Context<Self>) -> Self {\n        let mut snapbar = Self {\n",
              "    fn new(window: &mut Window, cx: &mut Context<Self>) -> Self {\n        let follower = TeamsWindowFollower::start(window);\n        let overlay_events = follower.as_ref().map(TeamsWindowFollower::subscribe);\n        let mut snapbar = Self {\n",
              "constructor prelude",
          )
          app = replace_once(
              app,
              "            follower: TeamsWindowFollower::start(window),\n",
              "            follower,\n",
              "follower initialization",
          )
          app = app.replace("            surface_hovered: false,\n", "", 1)
          app = app.replace("            hover_transition: None,\n", "", 1)
          app = replace_once(
              app,
              "        snapbar.start_resident_sync(window, cx);\n        snapbar\n",
              "        snapbar.start_resident_sync(window, cx);\n        if let Some(events) = overlay_events {\n            snapbar.start_overlay_sync(events, window, cx);\n        }\n        snapbar\n",
              "overlay event startup",
          )

          overlay_sync = '''    fn start_overlay_sync(
              &self,
              events: async_channel::Receiver<()>,
              window: &mut Window,
              cx: &mut Context<Self>,
          ) {
              cx.spawn_in(window, async move |this, cx| {
                  while events.recv().await.is_ok() {
                      if this
                          .update(cx, |this, cx| {
                              if this.sync_overlay_state() {
                                  cx.notify();
                              }
                          })
                          .is_err()
                      {
                          break;
                      }
                  }
              })
              .detach();
          }

          '''
          app = replace_once(
              app,
              "    fn sync_resident_state(&mut self, cx: &mut Context<Self>) {\n",
              overlay_sync + "    fn sync_resident_state(&mut self, cx: &mut Context<Self>) {\n",
              "overlay event loop",
          )

          app = sub_once(
              app,
              r"\n        let compact_layout = self.*?\n\n        let previous_state = self.capture_state;",
              "\n        changed |= self.sync_overlay_state();\n\n        let previous_state = self.capture_state;",
              "resident overlay synchronization",
          )
          app = replace_once(
              app,
              "        if previous_id != next_id {\n            self.reset_disclosure(cx);\n        }\n",
              "        if previous_id != next_id {\n            self.expanded = false;\n            self.compact_layout = false;\n            cx.notify();\n        }\n",
              "target-change reset",
          )
          app = replace_once(
              app,
              "                self.shared_content_hint = false;\n                self.reset_disclosure(cx);\n                self.sync_follower();\n",
              "                self.shared_content_hint = false;\n                self.expanded = false;\n                self.compact_layout = false;\n                cx.notify();\n                self.sync_follower();\n",
              "meeting-exit reset",
          )

          native_state = '''    fn sync_overlay_state(&mut self) -> bool {
              let Some(follower) = self.follower.as_ref() else {
                  let changed = self.expanded || self.compact_layout;
                  self.expanded = false;
                  self.compact_layout = false;
                  return changed;
              };

              let compact = follower.is_compact();
              let expanded = follower.is_visible() && follower.is_expanded() && !compact;
              let changed = self.compact_layout != compact || self.expanded != expanded;
              self.compact_layout = compact;
              self.expanded = expanded;
              changed
          }

          '''
          app = sub_once(
              app,
              r"    fn reset_disclosure\(&mut self, cx: &mut Context<Self>\) \{.*?\n    fn on_refresh_clicked",
              native_state + "    fn on_refresh_clicked",
              "remove GPUI hover controller",
          )

          hover_listener = ".on_hover(cx.listener(Self::on_surface_hovered))\n"
          if app.count(hover_listener) != 2:
              raise RuntimeError(
                  f"hover listener removal: expected two matches, found {app.count(hover_listener)}"
              )
          app = app.replace(hover_listener, "")
          app_path.write_text(app, encoding="utf-8")

          overlay_path = Path("src/overlay.rs")
          overlay = overlay_path.read_text(encoding="utf-8")
          for name in [
              "COLLAPSED_WIDTH",
              "COLLAPSED_HEIGHT",
              "EXPANDED_WIDTH",
              "EXPANDED_HEIGHT",
              "COMPACT_WIDTH",
              "COMPACT_HEIGHT",
          ]:
              overlay = replace_once(
                  overlay,
                  f"const {name}: f32",
                  f"pub const {name}: f32",
                  f"public {name}",
              )
          overlay_path.write_text(overlay, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = readme.replace("約`92 × 30px`", "約`92 × 28px`")
          readme = readme.replace("約`272 × 36px`", "約`272 × 34px`")
          old_hover = "カーソルが操作列から外れて約400ms経過すると自動で縮みます。GPUIがWindowsの`TrackMouseEvent`／`WM_MOUSELEAVE`を処理して離脱を通知し、展開・縮小の待機処理は1つのキャンセル可能な`Task`として管理します。常時カーソルポーリングとクリック固定はありません。"
          new_hover = "カーソルが操作列から外れて約400ms経過すると自動で縮みます。ホバー判定はGPUI要素ではなく、オーバーレイHWNDへ`SetWindowSubclass`で追加した単一のWin32状態機械が`TrackMouseEvent`／`WM_MOUSELEAVE`とウィンドウタイマーを処理します。タイマー発火時には`WindowFromPoint`でも実際のポインター位置を再確認し、展開中だけ低頻度の安全確認を行います。クリック固定と常時カーソルポーリングはありません。"
          readme = replace_once(readme, old_hover, new_hover, "README hover explanation")
          readme_path.write_text(readme, encoding="utf-8")

          docs_path = Path("docs/OVERLAY_BEHAVIOR.md")
          docs = docs_path.read_text(encoding="utf-8")
          docs = docs.replace("92 × 30", "92 × 28")
          docs = docs.replace("272 × 36", "272 × 34")
          docs = replace_once(
              docs,
              "- GPUI `on_hover` and its Windows `TrackMouseEvent` / `WM_MOUSELEAVE` path are the source of truth. A single stored `Task` provides cancellable expand/collapse debounce; do not add cursor polling or detached timer generations.\n",
              "- A window-level Win32 disclosure controller installed with `SetWindowSubclass` is the source of truth. It owns one explicit Collapsed / ExpandPending / Expanded / CollapsePending state machine, uses `TrackMouseEvent` / `WM_MOUSELEAVE`, and verifies the pointer with `WindowFromPoint` at timer boundaries. GPUI only renders the published mode.\n- The expanded-only safety timer is a bounded fallback for missed leave messages; never restore permanent cursor polling.\n",
              "overlay hover invariant",
          )
          docs = replace_once(
              docs,
              "- The visible surface, rather than the larger transparent GPUI window, is vertically centered inside the measured caption band so DPI scaling cannot push controls into the meeting UI.\n",
              "- Convert `DWMWA_CAPTION_BUTTON_BOUNDS` from window-relative coordinates using `GetWindowRect`, then clamp against screen-space `DWMWA_EXTENDED_FRAME_BOUNDS`. Position from the maximum expanded surface and reject any placement whose visible surface is not fully contained in the resulting caption band.\n",
              "overlay placement invariant",
          )
          docs_path.write_text(docs, encoding="utf-8")

          agents_path = Path("AGENTS.md")
          agents = agents_path.read_text(encoding="utf-8")
          agents = replace_once(
              agents,
              "- Use GPUI's `on_hover` / Windows mouse-leave path and a stored cancellable `Task` for hover disclosure. Do not add periodic cursor polling or detached timer-generation schemes.\n",
              "- Keep hover disclosure at the native overlay-window level: one `SetWindowSubclass` controller, one explicit state machine, `TrackMouseEvent` / `WM_MOUSELEAVE`, and pointer verification at timer boundaries. GPUI must only render the published mode. Do not use element-level hover as the source of truth, detached timer generations, or permanent cursor polling.\n",
              "AGENTS hover rule",
          )
          agents = replace_once(
              agents,
              "- Use DWM frame and caption-button bounds to avoid the Windows caption controls. When the available title-bar span is too narrow, reduce to a single camera control.\n",
              "- Use DWM frame and caption-button bounds to avoid the Windows caption controls. `DWMWA_CAPTION_BUTTON_BOUNDS` is window-relative and must be converted using `GetWindowRect` before combining it with screen-space `DWMWA_EXTENDED_FRAME_BOUNDS`. When the available title-bar span is too narrow, reduce to a single camera control.\n",
              "AGENTS coordinate-space rule",
          )
          agents_path.write_text(agents, encoding="utf-8")
          '@ | python -

      - name: Validate
        shell: pwsh
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo test
          git diff --check

      - name: Commit implementation
        shell: pwsh
        run: |
          Remove-Item ".github/workflows/one-shot-native-hover-titlebar.yml" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock src/app.rs src/overlay.rs README.md AGENTS.md docs/OVERLAY_BEHAVIOR.md .github/workflows/one-shot-native-hover-titlebar.yml
          git commit -m "fix: rebuild native hover and titlebar placement"
          git push origin HEAD:fix/native-hover-titlebar-placement
