name: Apply Win32 client-origin repair

on:
  push:
    branches: [fix/overlay-hover-clipping]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/overlay-hover-clipping
          fetch-depth: 0

      - name: Patch raw ClientToScreen binding
        shell: pwsh
        run: |
          $path = "src/overlay.rs"
          $text = Get-Content $path -Raw
          $text = $text.Replace(
            "        ClientToScreen, GWL_EXSTYLE, GetClientRect, GetCursorPos, GetWindowLongW, GetWindowRect,",
            "        GWL_EXSTYLE, GetClientRect, GetCursorPos, GetWindowLongW, GetWindowRect,"
          )
          $text = $text.Replace(
            "unsafe extern `"system`" {`n    fn SetWindowRgn(hwnd: *mut c_void, region: *mut c_void, redraw: i32) -> i32;",
            "unsafe extern `"system`" {`n    fn ClientToScreen(hwnd: *mut c_void, point: *mut POINT) -> i32;`n    fn SetWindowRgn(hwnd: *mut c_void, region: *mut c_void, redraw: i32) -> i32;"
          )
          $text = $text.Replace(
            "        ClientToScreen(hwnd, &mut client_origin).ok()?;",
            "        if ClientToScreen(hwnd.0, &mut client_origin) == 0 {`n            return None;`n        }"
          )
          Set-Content $path $text -Encoding utf8 -NoNewline

      - name: Format and commit repair
        shell: pwsh
        run: |
          cargo fmt --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --force .github/workflows/one-shot-client-to-screen-fix.yml
          git add src/overlay.rs
          git commit -m "fix: bind ClientToScreen through user32"
          git push origin HEAD:fix/overlay-hover-clipping
