name: Apply title-bar compile repair

on:
  push:
    branches: [feat/titlebar-hover-controls]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/titlebar-hover-controls
          fetch-depth: 0

      - name: Add stateful ID to compact capture button
        shell: pwsh
        run: |
          $encoded = ''
          $script = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($encoded))
          $script | python -

      - name: Format and commit repair
        shell: pwsh
        run: |
          cargo fmt --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --force .github/workflows/one-shot-titlebar-compile-fix.yml
          git add src/app.rs
          git commit -m "fix: make compact capture control stateful"
          git push origin HEAD:feat/titlebar-hover-controls
