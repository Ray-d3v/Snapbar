name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply projection-background fix
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          git fetch origin $env:GITHUB_HEAD_REF
          git checkout -B $env:GITHUB_HEAD_REF FETCH_HEAD

          $path = "src\capture\content_detector\visual.rs"
          $source = Get-Content -Raw $path
          if ($source -notmatch 'fn estimate_analysis_background') {
            $source = $source.Replace(
              '        let background = estimate_outer_background(&small);',
              '        let background = estimate_analysis_background(&small);'
            )
            $marker = 'fn estimate_outer_background(image: &RgbaImage) -> [u8; 4] {'
            $helper = @'
fn estimate_analysis_background(image: &RgbaImage) -> [u8; 4] {
    let width = image.width();
    let height = image.height();
    if width == 0 || height == 0 {
        return [0, 0, 0, 255];
    }

    // Teams may place shared content flush against the left, right, or bottom edge.
    // The top window-chrome band remains the stable source for the meeting background.
    let band = (width.min(height) / 40).clamp(1, 8);
    let sample_step = (width / 1024).max(1);
    let mut red = Vec::new();
    let mut green = Vec::new();
    let mut blue = Vec::new();

    for y in 0..band {
        let mut x = 0;
        while x < width {
            push_color_sample(image, x, y, &mut red, &mut green, &mut blue);
            x = x.saturating_add(sample_step);
        }
    }

    if red.is_empty() {
        return estimate_outer_background(image);
    }
    red.sort_unstable();
    green.sort_unstable();
    blue.sort_unstable();
    let middle = red.len() / 2;
    [red[middle], green[middle], blue[middle], 255]
}

'@
            $source = $source.Replace($marker, $helper + $marker)
            Set-Content -Path $path -Value $source -NoNewline -Encoding utf8
            cargo fmt --all

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $path
            git commit -m "fix: sample Teams chrome for projection background"
            git push origin "HEAD:$env:GITHUB_HEAD_REF"
          }

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release executable
        run: cargo build --release

      - name: Locate Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw "Inno Setup compiler was not found."
          }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = "0.1.0-beta.$env:GITHUB_RUN_NUMBER"
          & $env:ISCC "/DAppVersion=$version" "installer\Snapbar.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path "dist\Snapbar-Setup-x64.exe")) {
            throw "Installer was not generated."
          }

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: Snapbar-windows-x64
          path: target/release/snapbar.exe
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Snapbar-installer-windows-x64
          path: dist/Snapbar-Setup-x64.exe
          if-no-files-found: error

      - name: Publish beta release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.0-beta.$env:GITHUB_RUN_NUMBER"
          $notes = @"
          Windows 11向けのSnapbarベータビルドです。

          - Snapbar-Setup-x64.exe: ユーザー単位インストーラー
          - Snapbar-portable-x64.exe: ポータブル実行ファイル

          現在はコード署名していないため、Windows SmartScreenの警告が表示される場合があります。
          "@
          gh release create $tag `
            "dist/Snapbar-Setup-x64.exe#Snapbar-Setup-x64.exe" `
            "target/release/snapbar.exe#Snapbar-portable-x64.exe" `
            --target $env:GITHUB_SHA `
            --title "Snapbar $tag" `
            --notes $notes `
            --prerelease
