name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

concurrency:
  group: snapbar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate stable release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH."
          }
          $package = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'snapbar'
          if ($LASTEXITCODE -ne 0 -or $package.version -ne $tag.Substring(1)) {
            throw "Release tag must match the Snapbar package version."
          }
          if (-not (Test-Path "docs/releases/$tag.md")) {
            throw "Reviewed release notes are required for $tag."
          }

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release executable
        run: cargo build --release

      - name: Locate Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw "Inno Setup compiler was not found."
          }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build Windows installer and portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME.Substring(1)
          } else {
            "0.1.0-beta.$env:GITHUB_RUN_NUMBER"
          }
          & $env:ISCC "/DAppVersion=$version" "installer\Snapbar.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path "dist\Snapbar-Setup-x64.exe")) {
            throw "Installer was not generated."
          }
          Copy-Item "target\release\snapbar.exe" "dist\Snapbar-portable-x64.exe" -Force
          Get-FileHash "dist/Snapbar-Setup-x64.exe", "dist/Snapbar-portable-x64.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content "dist/Snapbar-SHA256SUMS.txt" -Encoding utf8

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: Snapbar-windows-x64
          path: dist/Snapbar-portable-x64.exe
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Snapbar-installer-windows-x64
          path: dist/Snapbar-Setup-x64.exe
          if-no-files-found: error

      - name: Publish beta release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.0-beta.$env:GITHUB_RUN_NUMBER"
          $notes = @"
          Windows 11向けのSnapbarベータビルドです。

          - Snapbar-Setup-x64.exe: Windowsサインイン時の自動起動が既定で有効なユーザー単位インストーラー
          - Snapbar-portable-x64.exe: インストール不要のポータブル実行ファイル

          主な変更:

          - 他者共有中のTeams会議ウィンドウを最大化しても、タイトルバーのSnapbarが消えないよう配置判定を修正
          - 自分がTeamsでモニター共有中の場合も、確認済みの共有モニターだけをワンクリックでクリップボードへコピー
          - Teamsの共有コントロールバー下へピル型オーバーレイを表示し、バーの展開・縮小・移動へ追従
          - ホバー展開・縮小時の描画と入力領域更新をさらに軽量化し、各ボタンの機能名表示を追加
          - インストーラーへWindowsサインイン時の自動起動を追加（追加タスク画面で解除可能）

          現在はコード署名していないため、Windows SmartScreenの警告が表示される場合があります。
          "@
          gh release create $tag `
            "dist/Snapbar-Setup-x64.exe" `
            "dist/Snapbar-portable-x64.exe" `
            --target $env:GITHUB_SHA `
            --title "Snapbar $tag" `
            --notes $notes `
            --prerelease

      - name: Publish stable release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag `
            "dist/Snapbar-Setup-x64.exe" `
            "dist/Snapbar-portable-x64.exe" `
            "dist/Snapbar-SHA256SUMS.txt" `
            --verify-tag `
            --title "Snapbar $tag" `
            --notes-file "docs/releases/$tag.md" `
            --latest
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
