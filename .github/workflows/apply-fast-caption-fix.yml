name: Apply fast capture and caption fix

on:
  push:
    branches:
      - work/fast-capture-caption-20260907

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Decode and apply staged patch
        shell: pwsh
        run: |
          @'
          import base64, gzip, pathlib
          src = pathlib.Path('.github/tmp/fast-caption.patch.gz.b64')
          data = gzip.decompress(base64.b64decode(src.read_text(encoding='utf-8').strip()))
          pathlib.Path('fast-caption.patch').write_bytes(data)
          '@ | python -
          git apply --check fast-caption.patch
          git apply fast-caption.patch
          Remove-Item fast-caption.patch -Force
          Remove-Item .github/tmp/fast-caption.patch.gz.b64 -Force
          Remove-Item .github/workflows/apply-fast-caption-fix.yml -Force

      - name: Format
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release executable
        run: cargo build --release

      - name: Check patch hygiene
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit validated source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            throw "No source changes were produced by the staged patch."
          }
          git commit -m "fix: make capture immediate and align overlay across DPI"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
