name: Apply fast capture and caption fix

on:
  push:
    branches: [work/fast-capture-caption-20260907]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and apply prepared patch
        shell: pwsh
        run: |
          python -c "import base64,gzip,pathlib; p=pathlib.Path('.github/snapbar-fast-caption.patch.gz.b64').read_text().strip(); pathlib.Path('snapbar-fast-caption.patch').write_bytes(gzip.decompress(base64.b64decode(p)))"
          git apply --index snapbar-fast-caption.patch
          Remove-Item snapbar-fast-caption.patch

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Commit validated changes
        shell: pwsh
        run: |
          Remove-Item .github/snapbar-fast-caption.patch.gz.b64
          Remove-Item .github/workflows/apply-fast-caption-fix.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: make capture immediate and align custom Teams caption"
          git push origin HEAD:work/fast-capture-caption-20260907
