name: Apply overlay clipping and hover repair

on:
  push:
    branches: [fix/overlay-hover-clipping]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/overlay-hover-clipping
          fetch-depth: 0

      - name: Apply source repair
        shell: pwsh
        run: |
          $encoded = ' '
          $script = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($encoded))
          $script | python -

      - name: Format and commit repair
        shell: pwsh
        run: |
          cargo fmt --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --force .github/workflows/one-shot-overlay-fix.yml
          git add src/app.rs src/overlay.rs
          git commit -m "fix: prevent overlay clipping and close hover menu reliably"
          git push origin HEAD:fix/overlay-hover-clipping
