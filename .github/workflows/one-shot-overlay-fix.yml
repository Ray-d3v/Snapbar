name: Apply overlay clipping and hover repair

on:
  push:
    branches: [fix/overlay-hover-clipping]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/overlay-hover-clipping
          fetch-depth: 0

      - name: Apply source repair
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise RuntimeError(f"Expected source block was not found: {label}")
              return text.replace(old, new, 1)

          app_path = Path("src/app.rs")
          app = app_path.read_text(encoding="utf-8")
          app = replace_once(
              app,
              "const MENU_CLOSE_DELAY: Duration = Duration::from_millis(220);\n",
              "const MENU_CLOSE_DELAY: Duration = Duration::from_millis(220);\nconst MENU_HOVER_WATCH_INTERVAL: Duration = Duration::from_millis(50);\n",
              "menu hover watchdog constant",
          )
          app = replace_once(
              app,
              "        snapbar.apply_meeting_snapshot(snapbar.meeting_monitor.snapshot());\n        snapbar.start_resident_sync(window, cx);\n        snapbar\n",
              "        snapbar.apply_meeting_snapshot(snapbar.meeting_monitor.snapshot());\n        snapbar.start_resident_sync(window, cx);\n        snapbar.start_menu_hover_watch(window, cx);\n        snapbar\n",
              "start hover watchdog",
          )
          sync_marker = "    fn sync_resident_state(&mut self, cx: &mut Context<Self>) {\n"
          hover_methods = '''    fn start_menu_hover_watch(&self, window: &mut Window, cx: &mut Context<Self>) {
        cx.spawn_in(window, async move |this, cx| {
            loop {
                cx.background_executor()
                    .timer(MENU_HOVER_WATCH_INTERVAL)
                    .await;
                if this
                    .update(cx, |this, cx| this.sync_native_menu_hover(cx))
                    .is_err()
                {
                    break;
                }
            }
        })
        .detach();
    }

    fn sync_native_menu_hover(&mut self, cx: &mut Context<Self>) {
        if !self.menu_open || self.menu_pinned {
            return;
        }

        let pointer_over = self
            .follower
            .as_ref()
            .is_some_and(|follower| follower.cursor_over_surface());
        if pointer_over == self.root_hovered {
            return;
        }

        self.root_hovered = pointer_over;
        if pointer_over {
            self.cancel_menu_close();
        } else {
            self.cancel_menu_open();
            self.schedule_menu_close_from_native(cx);
        }
    }

    fn schedule_menu_close_from_native(&mut self, cx: &mut Context<Self>) {
        if self.menu_pinned || !self.menu_open {
            return;
        }
        self.cancel_menu_close();
        let generation = self.menu_close_generation;
        cx.spawn(async move |this, cx| {
            cx.background_executor().timer(MENU_CLOSE_DELAY).await;
            let _ = this.update(cx, |this, cx| {
                let pointer_over = this
                    .follower
                    .as_ref()
                    .is_some_and(|follower| follower.cursor_over_surface());
                this.root_hovered = pointer_over;
                if this.menu_close_generation == generation
                    && !pointer_over
                    && !this.menu_pinned
                {
                    this.set_menu_open(false, cx);
                }
            });
        })
        .detach();
    }

'''
          if sync_marker not in app:
              raise RuntimeError("Expected source block was not found: resident sync marker")
          app = app.replace(sync_marker, hover_methods + sync_marker, 1)
          app_path.write_text(app, encoding="utf-8")

          overlay_path = Path("src/overlay.rs")
          overlay = overlay_path.read_text(encoding="utf-8")
          overlay = replace_once(
              overlay,
              "    Foundation::{HWND, RECT},\n",
              "    Foundation::{HWND, POINT, RECT},\n",
              "POINT import",
          )
          overlay = replace_once(
              overlay,
              "        GWL_EXSTYLE, GetClientRect, GetWindowLongW, GetWindowRect, HWND_TOPMOST, IsIconic,\n",
              "        ClientToScreen, GWL_EXSTYLE, GetClientRect, GetCursorPos, GetWindowLongW,\n        GetWindowRect, HWND_TOPMOST, IsIconic,\n",
              "cursor and client-origin imports",
          )
          overlay = replace_once(
              overlay,
              "    pub fn set_menu_open(&self, open: bool) {\n        self.menu_open.store(open, Ordering::Release);\n        apply_window_region(HWND(self.overlay_hwnd as *mut c_void), open);\n    }\n",
              "    pub fn set_menu_open(&self, open: bool) {\n        self.menu_open.store(open, Ordering::Release);\n        apply_window_region(HWND(self.overlay_hwnd as *mut c_void), open);\n    }\n\n    pub fn cursor_over_surface(&self) -> bool {\n        cursor_over_visible_surface(\n            HWND(self.overlay_hwnd as *mut c_void),\n            self.menu_open.load(Ordering::Acquire),\n        )\n    }\n",
              "native cursor query",
          )
          region_start = overlay.index("fn client_size(hwnd: HWND) -> Option<(i32, i32)> {")
          region_end = overlay.index("fn desired_placement(overlay_hwnd: HWND, target_hwnd: HWND) -> OverlayPlacement {")
          region_replacement = '''#[derive(Clone, Copy, Debug)]
struct WindowMetrics {
    window_left: i32,
    window_top: i32,
    client_screen_left: i32,
    client_screen_top: i32,
    client_width: i32,
    client_height: i32,
}

fn window_metrics(hwnd: HWND) -> Option<WindowMetrics> {
    let mut client_rect = RECT::default();
    let mut window_rect = RECT::default();
    let mut client_origin = POINT::default();
    unsafe {
        GetClientRect(hwnd, &mut client_rect).ok()?;
        GetWindowRect(hwnd, &mut window_rect).ok()?;
        ClientToScreen(hwnd, &mut client_origin).ok()?;
    }

    let client_width = client_rect.right.saturating_sub(client_rect.left);
    let client_height = client_rect.bottom.saturating_sub(client_rect.top);
    if client_width <= 0 || client_height <= 0 {
        return None;
    }

    Some(WindowMetrics {
        window_left: window_rect.left,
        window_top: window_rect.top,
        client_screen_left: client_origin.x,
        client_screen_top: client_origin.y,
        client_width,
        client_height,
    })
}

fn client_size(hwnd: HWND) -> Option<(i32, i32)> {
    let metrics = window_metrics(hwnd)?;
    Some((metrics.client_width, metrics.client_height))
}

fn scale_logical(value: i32, actual: i32, logical: i32) -> i32 {
    ((i64::from(value) * i64::from(actual)) / i64::from(logical)) as i32
}

fn apply_window_region(hwnd: HWND, menu_open: bool) {
    let Some(metrics) = window_metrics(hwnd) else {
        return;
    };

    // SetWindowRgn uses window-relative coordinates, while GPUI lays out in the client area.
    // Account for the non-client offset and include the full 68 px bar surface so shadows and
    // the lower edges of controls are never clipped by the native region.
    let client_left = metrics.client_screen_left - metrics.window_left;
    let client_top = metrics.client_screen_top - metrics.window_top;
    let right = client_left + metrics.client_width + 1;
    let bar_height = scale_logical(68, metrics.client_height, LOGICAL_WINDOW_HEIGHT)
        .clamp(1, metrics.client_height);
    let bar_bottom = client_top + bar_height + 1;
    let bar_region = unsafe {
        CreateRoundRectRgn(
            client_left,
            client_top,
            right,
            bar_bottom,
            bar_height,
            bar_height,
        )
    };
    if bar_region.is_null() {
        return;
    }

    if menu_open {
        // Overlap the input regions slightly. This removes the dead strip between the pill and
        // menu that previously swallowed mouse-leave tracking and left the menu stuck open.
        let menu_top = client_top
            + scale_logical(64, metrics.client_height, LOGICAL_WINDOW_HEIGHT)
                .clamp(0, metrics.client_height);
        let menu_bottom = client_top + metrics.client_height + 1;
        let menu_radius = scale_logical(40, metrics.client_height, LOGICAL_WINDOW_HEIGHT).max(1);
        let menu_region = unsafe {
            CreateRoundRectRgn(
                client_left,
                menu_top,
                right,
                menu_bottom,
                menu_radius,
                menu_radius,
            )
        };
        if !menu_region.is_null() {
            let combined = unsafe { CombineRgn(bar_region, bar_region, menu_region, RGN_OR) };
            unsafe {
                let _ = DeleteObject(menu_region);
            }
            if combined == 0 {
                unsafe {
                    let _ = DeleteObject(bar_region);
                }
                return;
            }
        }
    }

    let applied = unsafe { SetWindowRgn(hwnd.0, bar_region, 1) };
    if applied == 0 {
        unsafe {
            let _ = DeleteObject(bar_region);
        }
    }
}

fn cursor_over_visible_surface(hwnd: HWND, menu_open: bool) -> bool {
    let Some(metrics) = window_metrics(hwnd) else {
        return false;
    };
    let mut cursor = POINT::default();
    if unsafe { GetCursorPos(&mut cursor) }.is_err() {
        return false;
    }

    let local_x = cursor.x - metrics.client_screen_left;
    let local_y = cursor.y - metrics.client_screen_top;
    if local_x < 0
        || local_y < 0
        || local_x >= metrics.client_width
        || local_y >= metrics.client_height
    {
        return false;
    }

    let bar_bottom = scale_logical(68, metrics.client_height, LOGICAL_WINDOW_HEIGHT)
        .clamp(1, metrics.client_height);
    if local_y < bar_bottom {
        return true;
    }

    let menu_top = scale_logical(64, metrics.client_height, LOGICAL_WINDOW_HEIGHT)
        .clamp(0, metrics.client_height);
    menu_open && local_y >= menu_top
}

'''
          overlay = overlay[:region_start] + region_replacement + overlay[region_end:]
          overlay_path.write_text(overlay, encoding="utf-8")
          '@ | python -

      - name: Format and commit repair
        shell: pwsh
        run: |
          cargo fmt --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --force .github/workflows/one-shot-overlay-fix.yml
          git add src/app.rs src/overlay.rs
          git commit -m "fix: prevent overlay clipping and close hover menu reliably"
          git push origin HEAD:fix/overlay-hover-clipping
