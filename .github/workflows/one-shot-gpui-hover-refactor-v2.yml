name: Apply corrected GPUI hover refactor

on:
  push:
    branches: [fix/gpui-hover-disclosure]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gpui-hover-disclosure
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Apply hover refactor
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          def once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def sub_once(text: str, pattern: str, replacement: str, label: str, flags=0) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return updated

          app_path = Path("src/app.rs")
          app = app_path.read_text(encoding="utf-8")
          app = once(app, "use std::time::{Duration, Instant};", "use std::time::Duration;", "time import")
          app = once(
              app,
              "    overlay::TeamsWindowFollower,\n",
              "    overlay::{\n        COLLAPSED_HEIGHT, COLLAPSED_WIDTH, COMPACT_HEIGHT, COMPACT_WIDTH, EXPANDED_HEIGHT,\n        EXPANDED_WIDTH, TeamsWindowFollower, WINDOW_HEIGHT, WINDOW_WIDTH,\n    },\n",
              "overlay import",
          )
          app = once(
              app,
              "    App, Bounds, ClickEvent, Context, Window, WindowBackgroundAppearance, WindowBounds,\n",
              "    App, Bounds, ClickEvent, Context, Task, Window, WindowBackgroundAppearance, WindowBounds,\n",
              "Task import",
          )
          app = sub_once(
              app,
              r"const WINDOW_WIDTH: f32 = 280\.0;\nconst WINDOW_HEIGHT: f32 = 40\.0;\nconst COLLAPSED_WIDTH: f32 = 92\.0;\nconst EXPANDED_WIDTH: f32 = 272\.0;\nconst COMPACT_WIDTH: f32 = 40\.0;\nconst SURFACE_HEIGHT: f32 = 36\.0;\n(const RESIDENT_SYNC_INTERVAL:.*?\nconst EXPAND_DELAY:.*?\nconst COLLAPSE_DELAY:.*?\n)const HOVER_WATCH_INTERVAL:.*?\n",
              r"\1",
              "local geometry constants",
          )
          app = once(
              app,
              "    expanded: bool,\n    surface_hovered: bool,\n    expand_generation: u64,\n    collapse_generation: u64,\n",
              "    expanded: bool,\n    surface_hovered: bool,\n    hover_transition: Option<Task<()>>,\n",
              "hover fields",
          )
          app = once(
              app,
              "            expanded: false,\n            surface_hovered: false,\n            expand_generation: 0,\n            collapse_generation: 0,\n",
              "            expanded: false,\n            surface_hovered: false,\n            hover_transition: None,\n",
              "hover initialization",
          )
          app = once(
              app,
              "        snapbar.apply_meeting_snapshot(snapbar.meeting_monitor.snapshot());\n        snapbar.start_resident_sync(window, cx);\n        snapbar.start_hover_watch(window, cx);\n",
              "        let snapshot = snapbar.meeting_monitor.snapshot();\n        snapbar.apply_meeting_snapshot(snapshot, cx);\n        snapbar.start_resident_sync(window, cx);\n",
              "startup",
          )
          app = sub_once(
              app,
              r"\n    fn start_hover_watch\(&self, window: &mut Window, cx: &mut Context<Self>\) \{.*?\n    \}\n\n(?=    fn sync_resident_state)",
              "\n\n",
              "remove cursor polling",
              re.S,
          )
          app = once(
              app,
              "            self.apply_meeting_snapshot(snapshot);\n",
              "            self.apply_meeting_snapshot(snapshot, cx);\n",
              "snapshot call",
          )
          app = once(
              app,
              "        if compact_layout != self.compact_layout {\n            self.compact_layout = compact_layout;\n            if compact_layout {\n                self.expanded = false;\n                if let Some(follower) = &self.follower {\n                    follower.set_expanded(false);\n                }\n            }\n            changed = true;\n        }\n\n        let previous_state = self.capture_state;\n",
              "        if compact_layout != self.compact_layout {\n            self.compact_layout = compact_layout;\n            if compact_layout {\n                self.reset_disclosure(cx);\n            }\n            changed = true;\n        }\n\n        let follower_visible = self\n            .follower\n            .as_ref()\n            .is_some_and(TeamsWindowFollower::is_visible);\n        if !follower_visible\n            && (self.expanded || self.surface_hovered || self.hover_transition.is_some())\n        {\n            self.reset_disclosure(cx);\n            changed = true;\n        }\n\n        let previous_state = self.capture_state;\n",
              "compact/visibility reset",
          )
          app = once(
              app,
              "    fn apply_meeting_snapshot(&mut self, snapshot: MeetingSnapshot) {\n",
              "    fn apply_meeting_snapshot(&mut self, snapshot: MeetingSnapshot, cx: &mut Context<Self>) {\n",
              "snapshot signature",
          )
          app = once(
              app,
              "        let was_shared = self.shared_content_hint;\n        self.shared_content_hint = snapshot.shared_content_hint;\n\n        match snapshot.target {\n",
              "        let was_shared = self.shared_content_hint;\n        self.shared_content_hint = snapshot.shared_content_hint;\n\n        if previous_id != next_id {\n            self.reset_disclosure(cx);\n        }\n\n        match snapshot.target {\n",
              "target reset",
          )
          app = once(
              app,
              "                self.shared_content_hint = false;\n                self.expanded = false;\n                if let Some(follower) = &self.follower {\n                    follower.set_expanded(false);\n                }\n                self.sync_follower();\n",
              "                self.shared_content_hint = false;\n                self.reset_disclosure(cx);\n                self.sync_follower();\n",
              "meeting exit reset",
          )
          hover_methods = '''    fn reset_disclosure(&mut self, cx: &mut Context<Self>) {
              self.hover_transition = None;
              self.surface_hovered = false;
              self.set_expanded(false, cx);
          }

          fn set_expanded(&mut self, expanded: bool, cx: &mut Context<Self>) {
              let expanded = expanded && !self.compact_layout;
              if let Some(follower) = &self.follower {
                  follower.set_expanded(expanded);
              }
              if self.expanded == expanded {
                  return;
              }
              self.expanded = expanded;
              cx.notify();
          }

          fn on_surface_hovered(
              &mut self,
              hovered: &bool,
              window: &mut Window,
              cx: &mut Context<Self>,
          ) {
              self.hover_transition = None;

              if self.compact_layout {
                  self.surface_hovered = false;
                  self.set_expanded(false, cx);
                  return;
              }

              self.surface_hovered = *hovered;
              let target_expanded = *hovered;
              if self.expanded == target_expanded {
                  return;
              }

              let delay = if target_expanded {
                  EXPAND_DELAY
              } else {
                  COLLAPSE_DELAY
              };
              self.hover_transition = Some(cx.spawn_in(window, async move |this, cx| {
                  cx.background_executor().timer(delay).await;
                  let _ = this.update(cx, |this, cx| {
                      if this.compact_layout || this.surface_hovered != target_expanded {
                          return;
                      }
                      this.set_expanded(target_expanded, cx);
                  });
              }));
          }
          '''
          app = sub_once(
              app,
              r"    fn set_expanded\(&mut self, expanded: bool, cx: &mut Context<Self>\) \{.*?\n    fn on_refresh_clicked",
              hover_methods + "\n    fn on_refresh_clicked",
              "hover implementation",
              re.S,
          )
          app = once(app, '.id("compact-capture")', '.id("titlebar-surface")', "compact stable id")
          app = once(app, '.w(px(COMPACT_WIDTH))\n            .h(px(SURFACE_HEIGHT))', '.w(px(COMPACT_WIDTH))\n            .h(px(COMPACT_HEIGHT))', "compact size")
          app = once(app, '.id("titlebar-trigger")', '.id("titlebar-surface")', "collapsed stable id")
          app = once(app, '.h(px(30.0))', '.h(px(COLLAPSED_HEIGHT))', "collapsed height")
          app = once(app, '.id("titlebar-controls")', '.id("titlebar-surface")', "expanded stable id")
          app = once(app, '.h(px(SURFACE_HEIGHT))', '.h(px(EXPANDED_HEIGHT))', "expanded height")
          app_path.write_text(app, encoding="utf-8")

          overlay_path = Path("src/overlay.rs")
          overlay = overlay_path.read_text(encoding="utf-8")
          overlay = once(
              overlay,
              "        atomic::{AtomicBool, AtomicU32, Ordering},\n    },\n",
              "        atomic::{AtomicBool, AtomicU32, Ordering},\n        mpsc::{RecvTimeoutError, SyncSender, sync_channel},\n    },\n",
              "mpsc import",
          )
          overlay = once(overlay, "GetClientRect, GetCursorPos, GetWindowLongW", "GetClientRect, GetWindowLongW", "cursor import")
          geometry = '''const FOLLOW_INTERVAL: Duration = Duration::from_millis(100);
          const IDLE_INTERVAL: Duration = Duration::from_millis(500);
          const DWMWA_COLOR_NONE: u32 = 0xffff_fffe;

          pub const WINDOW_WIDTH: f32 = 280.0;
          pub const WINDOW_HEIGHT: f32 = 40.0;
          pub const COLLAPSED_WIDTH: f32 = 92.0;
          pub const COLLAPSED_HEIGHT: f32 = 30.0;
          pub const EXPANDED_WIDTH: f32 = 272.0;
          pub const EXPANDED_HEIGHT: f32 = 36.0;
          pub const COMPACT_WIDTH: f32 = 40.0;
          pub const COMPACT_HEIGHT: f32 = 36.0;

          #[derive(Clone, Copy, Debug, PartialEq, Eq)]
          enum OverlayMode {
              Collapsed,
              Expanded,
              Compact,
          }

          impl OverlayMode {
              const fn from_state(expanded: bool, compact: bool) -> Self {
                  if compact {
                      Self::Compact
                  } else if expanded {
                      Self::Expanded
                  } else {
                      Self::Collapsed
                  }
              }

              const fn logical_width(self) -> f32 {
                  match self {
                      Self::Collapsed => COLLAPSED_WIDTH,
                      Self::Expanded => EXPANDED_WIDTH,
                      Self::Compact => COMPACT_WIDTH,
                  }
              }

              const fn logical_height(self) -> f32 {
                  match self {
                      Self::Collapsed => COLLAPSED_HEIGHT,
                      Self::Expanded => EXPANDED_HEIGHT,
                      Self::Compact => COMPACT_HEIGHT,
                  }
              }
          }
          '''
          overlay = sub_once(
              overlay,
              r"const FOLLOW_INTERVAL:.*?const LOGICAL_SURFACE_TOP: i32 = 2;\n",
              geometry,
              "shared geometry",
              re.S,
          )
          overlay = once(
              overlay,
              "    compact: Arc<AtomicBool>,\n    overlay_hwnd: isize,\n    stop: Arc<AtomicBool>,\n",
              "    compact: Arc<AtomicBool>,\n    visible: Arc<AtomicBool>,\n    wake_tx: SyncSender<()>,\n    stop: Arc<AtomicBool>,\n",
              "follower fields",
          )
          overlay = once(
              overlay,
              "        configure_overlay_window(overlay_hwnd);\n        apply_window_region(overlay_hwnd, false, false);\n        unsafe {\n",
              "        configure_overlay_window(overlay_hwnd);\n        unsafe {\n",
              "initial region writer",
          )
          overlay = once(
              overlay,
              "        let compact = Arc::new(AtomicBool::new(false));\n        let stop = Arc::new(AtomicBool::new(false));\n",
              "        let compact = Arc::new(AtomicBool::new(false));\n        let visible = Arc::new(AtomicBool::new(false));\n        let stop = Arc::new(AtomicBool::new(false));\n        let (wake_tx, wake_rx) = sync_channel(1);\n",
              "follower state",
          )
          overlay = once(
              overlay,
              "        let thread_compact = Arc::clone(&compact);\n        let thread_stop = Arc::clone(&stop);\n",
              "        let thread_compact = Arc::clone(&compact);\n        let thread_visible = Arc::clone(&visible);\n        let thread_stop = Arc::clone(&stop);\n",
              "worker state",
          )
          worker_loop = '''                let mut previous_placement = None;
                          let mut previous_region_state = None;
                          while !thread_stop.load(Ordering::Acquire) {
                              let target_id = thread_target_id.load(Ordering::Acquire);
                              let placement = if target_id == 0 {
                                  OverlayPlacement::Hidden
                              } else {
                                  let target_hwnd = HWND(target_id as usize as *mut c_void);
                                  desired_placement(overlay_hwnd, target_hwnd)
                              };

                              let visible_now = matches!(placement, OverlayPlacement::Visible { .. });
                              thread_visible.store(visible_now, Ordering::Release);
                              let compact_layout = matches!(
                                  placement,
                                  OverlayPlacement::Visible { compact: true, .. }
                              );
                              thread_compact.store(compact_layout, Ordering::Release);
                              let mode = OverlayMode::from_state(
                                  thread_expanded.load(Ordering::Acquire),
                                  compact_layout,
                              );
                              let region_state = (client_size(overlay_hwnd), mode);
                              if previous_region_state != Some(region_state) {
                                  apply_window_region(overlay_hwnd, mode);
                                  previous_region_state = Some(region_state);
                              }

                              if previous_placement != Some(placement) {
                                  apply_placement(overlay_hwnd, placement);
                                  previous_placement = Some(placement);
                              }

                              let wait = if target_id == 0 {
                                  IDLE_INTERVAL
                              } else {
                                  FOLLOW_INTERVAL
                              };
                              match wake_rx.recv_timeout(wait) {
                                  Ok(()) | Err(RecvTimeoutError::Timeout) => {}
                                  Err(RecvTimeoutError::Disconnected) => break,
                              }
                          }
                          thread_visible.store(false, Ordering::Release);
                          apply_placement(overlay_hwnd, OverlayPlacement::Hidden);'''
          overlay = sub_once(
              overlay,
              r"                let mut previous_placement = None;.*?                apply_placement\(overlay_hwnd, OverlayPlacement::Hidden\);",
              worker_loop,
              "worker loop",
              re.S,
          )
          overlay = once(
              overlay,
              "            compact,\n            overlay_hwnd: overlay_value,\n            stop,\n",
              "            compact,\n            visible,\n            wake_tx,\n            stop,\n",
              "follower construction",
          )
          follower_methods = '''    fn wake(&self) {
              let _ = self.wake_tx.try_send(());
          }

          pub fn set_target(&self, target_id: Option<u32>) {
              self.target_id
                  .store(target_id.unwrap_or_default(), Ordering::Release);
              self.wake();
          }

          pub fn set_expanded(&self, expanded: bool) {
              self.expanded.store(expanded, Ordering::Release);
              self.wake();
          }

          pub fn is_compact(&self) -> bool {
              self.compact.load(Ordering::Acquire)
          }

          pub fn is_visible(&self) -> bool {
              self.visible.load(Ordering::Acquire)
          }
          '''
          overlay = sub_once(
              overlay,
              r"    pub fn set_target\(&self, target_id: Option<u32>\) \{.*?\n    \}\n\n(?=impl Drop for TeamsWindowFollower)",
              follower_methods + "\n}",
              "follower methods",
              re.S,
          )
          overlay = once(
              overlay,
              "        self.stop.store(true, Ordering::Release);\n        if let Some(worker) = self.worker.take() {\n",
              "        self.stop.store(true, Ordering::Release);\n        self.wake();\n        if let Some(worker) = self.worker.take() {\n",
              "wake on drop",
          )
          surface_geometry = '''fn scale_logical(value: f32, actual: i32, logical: f32) -> i32 {
              ((value * actual as f32) / logical).round() as i32
          }

          fn surface_rect(width: i32, height: i32, mode: OverlayMode) -> RECT {
              let surface_width =
                  scale_logical(mode.logical_width(), width, WINDOW_WIDTH).clamp(1, width);
              let surface_height =
                  scale_logical(mode.logical_height(), height, WINDOW_HEIGHT).clamp(1, height);
              let surface_left = (width - surface_width) / 2;
              let surface_top = (height - surface_height) / 2;

              RECT {
                  left: surface_left,
                  top: surface_top,
                  right: surface_left + surface_width,
                  bottom: surface_top + surface_height,
              }
          }

          fn apply_window_region(hwnd: HWND, mode: OverlayMode) {
              let Some(metrics) = window_metrics(hwnd) else {
                  return;
              };

              let client_left = metrics.client_screen_left - metrics.window_left;
              let client_top = metrics.client_screen_top - metrics.window_top;
              let surface = surface_rect(metrics.client_width, metrics.client_height, mode);
              let height = surface.bottom.saturating_sub(surface.top).max(1);
              let region = unsafe {
                  CreateRoundRectRgn(
                      client_left + surface.left,
                      client_top + surface.top,
                      client_left + surface.right + 1,
                      client_top + surface.bottom + 1,
                      height,
                      height,
                  )
              };
              if region.is_null() {
                  return;
              }

              let applied = unsafe { SetWindowRgn(hwnd.0, region, 1) };
              if applied == 0 {
                  unsafe {
                      let _ = DeleteObject(region);
                  }
              }
          }
          '''
          overlay = sub_once(
              overlay,
              r"fn scale_logical\(value: i32, actual: i32, logical: i32\) -> i32 \{.*?\nfn desired_placement",
              surface_geometry + "\nfn desired_placement",
              "surface geometry and cursor polling removal",
              re.S,
          )
          overlay = once(
              overlay,
              "    let visible_surface = surface_rect(\n        overlay_metrics.client_width,\n        overlay_metrics.client_height,\n        false,\n        false,\n    );\n    let visible_top_offset = overlay_metrics\n        .client_screen_top\n        .saturating_sub(overlay_metrics.window_top)\n        .saturating_add(visible_surface.top);\n    let visible_height = visible_surface.bottom.saturating_sub(visible_surface.top);\n    if visible_height <= 0 {\n        return OverlayPlacement::Hidden;\n    }\n",
              "    let collapsed_surface = surface_rect(\n        overlay_metrics.client_width,\n        overlay_metrics.client_height,\n        OverlayMode::Collapsed,\n    );\n    let expanded_surface = surface_rect(\n        overlay_metrics.client_width,\n        overlay_metrics.client_height,\n        OverlayMode::Expanded,\n    );\n    let visible_top_offset = overlay_metrics\n        .client_screen_top\n        .saturating_sub(overlay_metrics.window_top)\n        .saturating_add(collapsed_surface.top);\n    let visible_height = collapsed_surface\n        .bottom\n        .saturating_sub(collapsed_surface.top);\n    let expanded_width = expanded_surface\n        .right\n        .saturating_sub(expanded_surface.left);\n    if visible_height <= 0 || expanded_width <= 0 {\n        return OverlayPlacement::Hidden;\n    }\n",
              "placement geometry",
          )
          overlay = once(overlay, "    let compact = available_width < overlay_width;\n", "    let compact = available_width < expanded_width;\n", "compact threshold")
          overlay = once(overlay, "        let minimum_center = safe_left.saturating_add(overlay_width / 2);\n        let maximum_center = safe_right.saturating_sub(overlay_width / 2);\n", "        let minimum_center = safe_left.saturating_add(expanded_width / 2);\n        let maximum_center = safe_right.saturating_sub(expanded_width / 2);\n", "safe center")
          tests = '''

          #[cfg(test)]
          mod tests {
              use super::*;

              fn rect_tuple(rect: RECT) -> (i32, i32, i32, i32) {
                  (rect.left, rect.top, rect.right, rect.bottom)
              }

              #[test]
              fn compact_mode_always_wins() {
                  assert_eq!(OverlayMode::from_state(false, false), OverlayMode::Collapsed);
                  assert_eq!(OverlayMode::from_state(true, false), OverlayMode::Expanded);
                  assert_eq!(OverlayMode::from_state(false, true), OverlayMode::Compact);
                  assert_eq!(OverlayMode::from_state(true, true), OverlayMode::Compact);
              }

              #[test]
              fn region_matches_each_visible_surface() {
                  assert_eq!(
                      rect_tuple(surface_rect(280, 40, OverlayMode::Collapsed)),
                      (94, 5, 186, 35)
                  );
                  assert_eq!(
                      rect_tuple(surface_rect(280, 40, OverlayMode::Expanded)),
                      (4, 2, 276, 38)
                  );
                  assert_eq!(
                      rect_tuple(surface_rect(280, 40, OverlayMode::Compact)),
                      (120, 2, 160, 38)
                  );
              }

              #[test]
              fn scaled_regions_stay_centered_and_bounded() {
                  for mode in [
                      OverlayMode::Collapsed,
                      OverlayMode::Expanded,
                      OverlayMode::Compact,
                  ] {
                      let rect = surface_rect(350, 50, mode);
                      assert!(((rect.left + rect.right) - 350).abs() <= 1);
                      assert!(((rect.top + rect.bottom) - 50).abs() <= 1);
                      assert!(rect.left >= 0 && rect.top >= 0);
                      assert!(rect.right <= 350 && rect.bottom <= 50);
                  }
              }
          }
          '''
          overlay = overlay.rstrip() + tests
          overlay_path.write_text(overlay, encoding="utf-8")

          docs_path = Path("docs/OVERLAY_BEHAVIOR.md")
          docs = docs_path.read_text(encoding="utf-8")
          docs = once(
              docs,
              "- Native cursor-position checks are the source of truth when GPUI misses a mouse-leave event. There is no click-to-pin state that can leave the strip permanently open.\n",
              "- GPUI `on_hover` and its Windows `TrackMouseEvent` / `WM_MOUSELEAVE` path are the source of truth. A single stored `Task` provides cancellable expand/collapse debounce; do not add cursor polling or detached timer generations.\n- Collapsed, expanded, and compact dimensions come from one shared geometry source, and only the follower worker writes the native Win32 region.\n- There is no click-to-pin state that can leave the strip permanently open.\n",
              "overlay docs",
          )
          docs_path.write_text(docs, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = once(
              readme,
              "カーソルが操作列から外れて約400ms経過すると自動で縮みます。GPUIのマウス離脱イベントが欠落した場合も、Win32の実カーソル座標を50ms間隔で確認して必ず閉じます。クリック固定はありません。",
              "カーソルが操作列から外れて約400ms経過すると自動で縮みます。GPUIがWindowsの`TrackMouseEvent`／`WM_MOUSELEAVE`を処理して離脱を通知し、展開・縮小の待機処理は1つのキャンセル可能な`Task`として管理します。常時カーソルポーリングとクリック固定はありません。",
              "README hover text",
          )
          readme_path.write_text(readme, encoding="utf-8")

          agents_path = Path("AGENTS.md")
          agents = agents_path.read_text(encoding="utf-8")
          agents = once(
              agents,
              "- Hover expansion and collapse must be debounced. The non-pinned control strip must always collapse after the pointer leaves the actual visible surface.\n",
              "- Hover expansion and collapse must be debounced. The non-pinned control strip must always collapse after the pointer leaves the actual visible surface.\n- Use GPUI's `on_hover` / Windows mouse-leave path and a stored cancellable `Task` for hover disclosure. Do not add periodic cursor polling or detached timer-generation schemes.\n",
              "AGENTS hover rule",
          )
          agents = once(
              agents,
              "- Keep the native input region aligned to the currently visible collapsed, expanded, or compact silhouette.\n",
              "- Keep the native input region aligned to the currently visible collapsed, expanded, or compact silhouette. Use one shared geometry source and one native-region writer.\n",
              "AGENTS geometry rule",
          )
          agents_path.write_text(agents, encoding="utf-8")
          '@ | python -

      - name: Format and compile-check
        shell: pwsh
        run: |
          cargo fmt --all
          cargo check --all-targets
          git diff --check

      - name: Commit refactor
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --force .github/workflows/one-shot-gpui-hover-refactor.yml .github/workflows/one-shot-gpui-hover-refactor-v2.yml
          git add AGENTS.md README.md docs/OVERLAY_BEHAVIOR.md src/app.rs src/overlay.rs
          git commit -m "fix: simplify title-bar hover disclosure"
          git push origin HEAD:fix/gpui-hover-disclosure
