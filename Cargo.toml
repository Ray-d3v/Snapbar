[package]
name = "snapbar"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "One-click Microsoft Teams shared-screen capture for Windows"
repository = "https://github.com/Ray-d3v/Snapbar"
publish = false

[dependencies]
anyhow = "1"
async-channel = "2"
gpui = { git = "https://github.com/zed-industries/zed", rev = "4d1935b8d00320841da476ec38c7b7747abf6f09", default-features = false, features = ["windows-manifest"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "4d1935b8d00320841da476ec38c7b7747abf6f09" }

[target.'cfg(target_os = "windows")'.dependencies]
arboard = "3.6.1"
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
uiautomation = { version = "0.25", default-features = false, features = ["input"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-capture = "2.0.1"
xcap = { version = "0.9.8", features = ["wgc"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
